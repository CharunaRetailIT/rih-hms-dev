name: rit_handheld
description: RIT HMS — waiter handheld (Tab Ordering). iOS + Android, phone + tablet.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/rit_logo.png
    - assets/rit_wordmark.png

# Native launch screen (iOS + Android): RETAIL IT wordmark on white. Run:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#ffffff"
  image: assets/rit_wordmark.png
  android_12:
    color: "#ffffff"
    image: assets/rit_logo.png      # square mark fits Android-12's circular crop
  ios: true
  android: true
  web: false

# App launcher icon (iOS + Android). Run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/rit_icon.png"
  adaptive_icon_background: "#15803d"
  adaptive_icon_foreground: "assets/rit_icon_fg.png"
