org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler crashes trying to relativize a path between the pub
# cache (often on C:) and this project (on whatever drive it's checked out to) when
# they're on different drive letters — a known Windows-only Kotlin/Gradle bug. Disabling
# incremental compilation avoids the crash; full compiles are a bit slower but reliable.
kotlin.incremental=false
